    - data:
        isInIteration: false
        isInLoop: false
        sourceType: agent
        targetType: answer
      id: agent-answer-local
      source: agentic_strategy_local
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: agent
        targetType: answer
      id: ppt-agent-answer-local
      source: ppt_master_local
      sourceHandle: source
      target: ppt_answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
