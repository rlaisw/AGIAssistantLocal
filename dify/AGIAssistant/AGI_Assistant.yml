              extra:
                description: 'Generate a chart image from data. Returns {chart_type, image_url, usage}. MANDATORY data format: each item is an object with canonical field names "category" and "value" (use "time" instead of "category" for line/area): [{"category": "Peter", "value": 180}]. Rename source columns to these exact fields ("Student"->"category", "Height (cm)->"value"); values must be numbers. Any 2-field record shape is auto-normalized, but canonical fields are safest.\n        EXCEPT scatter: each point needs TWO numbers — {"x": <number>, "y": <number>}\n        (e.g. height/weight, age/salary); numeric {"category","value"} pairs are\n        mapped to x/y automatically, but "x"/"y" is the reliable shape. axis_x_title / axis_y_title set human axis labels — ALWAYS pass them when the user names the columns (e.g. axis_x_title="Students", axis_y_title="Height (cm)"); without them the axes are labeled with the raw field names category/value. width/height (px, <= 4000, 0 = default) override
