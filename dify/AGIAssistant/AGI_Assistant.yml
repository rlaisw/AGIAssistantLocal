        isInLoop: false
        sourceType: if-else
        targetType: agent
      id: attach-local-general
      source: attach_router_local
      sourceHandle: 'true'
      target: agentic_strategy_local
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: question-classifier
      id: attach-local-classifier
      source: attach_router_local
      sourceHandle: 'false'
      target: intent_router_local
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: agent
      id: router-general-local
      source: intent_router_local
      sourceHandle: general
      target: agentic_strategy_local
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
