            a request to DO something inside the user''s browser or current chrome
            session (create/click/type/select there, e.g. ''create a new api key in
            current chrome session'', ''click the Create Key button''), and NEVER
            a local file/program/Office task on the user''s Windows computer — those
            belong to the Hermes local task class even when they contain the words
            ''search'', ''find'', or ''look up'''
        - id: hermes_file
          label: ''
          name: Hermes local task
          topic: The user asks to create, write, read, or list files or folders on
            their Windows computer / local disk, OR to launch, open, start, or run
            a program or application on their Windows computer (e.g. 'create a folder
            hello_test in C:\\temp and write hello.txt inside it', 'list the files
            in C:\\temp', 'read C:\\temp\\notes.txt', 'launch Outlook', 'open Excel',
            'run C:\\tools\\mytool.exe'), OR to control Microsoft Office applications
            — open/edit/write Word, Excel, PowerPoint, or Outlook documents, cells,
            slides, or emails — including structure edits such as inserting rows or
            columns, adding or renaming headers, and changing slide backgrounds or
            themes, AND ANY 'type/write/put a VALUE into a cell' request (e.g. 'type
            12345 at cell B1', 'write hello in cell A1', 'put 42 into C3'), AND ANY
            'open <app> with file name X' / 'open <app> and type X' phrasing (e.g.
            'open excel with file name test1.xlsx, type 12345 at cell B1', 'open MS
            Word and type hello', 'open PowerPoint and type a slide titled X') , AND
            ANY BROWSER-ACTION request — when the user asks the assistant to DO something
            inside their browser or current chrome session ('create a new api key
            in current chrome session', 'in my browser log in to X', 'click the Create
            Key button on openrouter', 'do it in my browser') — even when the request
            also contains the words 'search', 'find', or 'look up' — it is a BROWSER
            ACTION routed to the Hermes browser lane (browser_navigate_v2, browser_read_v2,
            browser_click_v2), NOT a web search. ACTION-IN-BROWSER BEATS SEARCH-FOR-INFORMATION
            whenever the request names the user's browser or chrome session, or asks
            the assistant to perform clicks, logins, or key creation there. During
