    - data:
        code: "function main({answer, items}) {\n  var called = false;\n  if (Array.isArray(items)) {\n    for (var i = 0; i < items.length; i++) {\n      var d = (items[i] && items[i].data) || {};\n      if (Array.isArray(d.tool_input) && d.tool_input.length > 0) { called = true; break; }\n      var o = d.output;\n      if (o && typeof o === 'object' && o.tool_response) { called = true; break; }\n    }\n  }\n  // the-local-agent-was-NOT-called (2026-11-09): test only the VISIBLE answer.\n  // kimi-k3 wraps its thinking in ``` fences and the answer follows the last\n  // fence; the thinking legitimately mentions tool names and must never count\n  // as a claim. Fence-less text is tested whole (over-block direction).\n  var parts = String(answer).split('```');\n  var visible = String(answer);\n  for (var j = parts.length - 1; j >= 0; j--) {\n    if (parts[j] && parts[j].trim()) { visible = parts[j]; break; }\n  }\n  // hermes-run-command-with-task-not-work (2026-11-09): a leaked invocation\n  // tag naming a hermes tool proves the call was emitted as plain text and\n  // never dispatched — replace it with an honest dispatch-failure notice.\n  var leaked = /<(invoke|function_call|tool_call)[^>]*hermes_/i.test(visible);\n  if (!called && leaked) {\n    return {result: 'Dispatch check: the local agent was NOT called — the tool call was emitted as plain text instead of being dispatched (a model formatting glitch), so nothing was done on your computer. Please send the request again; if it keeps happening, a fresh conversation is the most reliable path.'};\n  }\n  var claims = /local agent (completed|did|was)|the agent (sent|pressed|opened|typed|launched|focused|confirmed|handled)|the tool (returned|responded)|confirmed (by |with )?(a |the )?(snapshot|it)|LAUNCH: ?(SUCCESS|FAILED)|hermes_(launch_app|office_task|file_task|cancel_turn|run_command|run_powershell) (succeeded|completed|returned|ran)/i;\n  if (!called && claims.test(visible)) {\n    return {result: 'Honesty check: the local agent was NOT actually called for this request, so nothing was done on your computer — the reply was blocked because it claimed local-agent work that never ran. To get a real result, ask for a specific allowed command: show system info (its output includes the system locale), show my ip address, list the running processes, what is my computer name, show disk spaces, or ping a host.'};\n  }\n  return {result: answer};\n}"
