              \ below before every image/infographic rule. Do not call infographics_generate\
              \ on that turn; provide the required manual steps and mcp_action result\
              \ instead.\n\n# Hermes Local Agent (specs 028 + 029)\n\nMCP-ACTION PROTOCOL\
              \ (spec 047) — ASK FIRST:\n- Ask for any critical missing target or\
              \ parameter first. Give tailored manual steps before any automatic-action\
