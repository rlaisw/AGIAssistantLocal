app:
  description: AgenticRAG agent + PPT-Master deck generator. Deck requests route to
    the PPT-Master agent (ppt_* MCP tools, spec 009/010); everything else goes to
    the AgenticRAG agent.
  icon: 💬
  icon_background: '#FEF7C3'
  icon_type: emoji
  mode: advanced-chat
  name: AGI Assistant
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/agent:0.0.51@3c6c32e593b33476cb52f4e5aaf1bf23e1c71b3d07ba64d40690e0dbce3a7e34
    version: null
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openrouter:0.2.1@cac50ed282c8d93b2bf06da65ae258697554602f947501a0994cdd6a468555e7
    version: null
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.4@5d39c30ea84ce4137df99ef33f4f9d74497c8f4e5605d17b47a553a33b194486
    version: null
kind: app
site:
  chat_color_theme: null
  chat_color_theme_inverted: false
  copyright: null
  custom_disclaimer: ''
  default_language: en-US
  description: null
  icon: 💬
  icon_background: '#FEF7C3'
  icon_type: emoji
  input_placeholder: null
  privacy_policy: null
  show_workflow_steps: true
  title: Chatflow Basic (AgenticRAG Agent)
  use_icon_as_answer_icon: false
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: Hi! I'm connected to the AgenticRAG MCP server. Test me with
      — "what is the server status", "list my sources", "ask about quarterly revenue",
      "search for Apollo 11", "sync all sources", "add the fixtures folder as a source",
      "query the graph for X", or "remove a source".
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: agent
        targetType: code
      id: agent-honesty
      source: agentic_strategy
      sourceHandle: source
      target: honesty_check
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: agent
        targetType: answer
      id: ppt-agent-answer
      source: ppt_master
      sourceHandle: source
      target: ppt_answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: agent
      id: router-general
      source: intent_router
      sourceHandle: general
      target: agentic_strategy
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: agent
      id: router-ppt
      source: intent_router
      sourceHandle: ppt_request
      target: ppt_master
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: if-else
      id: start-model-router
      source: '1776072202913'
      sourceHandle: source
      target: model_router
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: if-else
      id: router-cloud
      source: model_router
      sourceHandle: 'false'
      target: attach_router_cloud
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
